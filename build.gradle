apply plugin: 'idea'

version = '2.5.2'
def jcommanderVersion = ''

if (!('release' in gradle.startParameter.taskNames)) {
    // we compile against 1.48 normally, to match what's in AOSP, but switch to a newer version
    // for release, because it has some fixes required when running on Android
    jcommanderVersion = 'com.beust:jcommander:1.48'

    def versionSuffix
    try {
        def git = org.eclipse.jgit.api.Git.open(file('.'))
        // exactRef replaces the getRef() removed after JGit 4.x.
        def head = git.getRepository().exactRef('HEAD')
        versionSuffix = head.getObjectId().abbreviate(8).name()

        if (!git.status().call().clean) {
            versionSuffix += '-dirty'
        }
    } catch (Exception) {
        // In case we can't get the commit for some reason,
        // just use -dev
        versionSuffix = 'dev'
    }

    version += "-${versionSuffix}"
} else {
    jcommanderVersion = 'com.beust:jcommander:1.64'
}

// Note: please don't use this. This is strictly for the official releases
// that are posted on, e.g. the bitbucket download page.
task release() {
}

task(install).doLast {
    println "Installing version: ${version}"
}

// The projects that get pushed to maven
def maven_release_projects = ['smali', 'baksmali', 'dexlib2', 'util']

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    if (JavaVersion.current().isJava8Compatible()) {
        allprojects {
            tasks.withType(Javadoc) {
                options.addStringOption('Xdoclint:none', '-quiet')
            }
        }
    }

    version = parent.version

    java {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ext {
        depends = [
                guava: 'com.google.guava:guava:27.1-android',
                // jsr305 provides the javax.annotation.* nullness annotations used
                // across the codebase (formerly keyed as `findbugs`). 3.0.2 is the
                // current release and matches what guava transitively pulls in.
                jsr305: 'com.google.code.findbugs:jsr305:3.0.2',
                junit: 'junit:junit:4.12',
                mockito: 'org.mockito:mockito-core:1.10.19',
                antlr_runtime: 'org.antlr:antlr-runtime:3.5.2',
                antlr: 'org.antlr:antlr:3.5.2',
                stringtemplate: 'org.antlr:stringtemplate:3.2.1',
                jflex_plugin: 'org.xbib.gradle.plugin:gradle-plugin-jflex:1.1.0',
                proguard_gradle: 'net.sf.proguard:proguard-gradle:6.2.2',
                dx: 'com.google.android.tools:dx:1.7',
                gson: 'com.google.code.gson:gson:2.3.1',
                jcommander: jcommanderVersion
        ]
    }

    repositories {
        mavenCentral()
    }

    if (project.name in maven_release_projects) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        // Publishing coordinates. This fork publishes under its own,
        // GitHub-verifiable namespace by default (io.github.<org>), so it does
        // not collide with the upstream org.smali artifacts. Override with
        // -PmavenGroup=... if you own a different namespace.
        group = project.findProperty('mavenGroup') ?: 'io.github.android-security-engineer'

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = project.name
                    from components.java
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }

                    pom {
                        name = project.name
                        description = 'AI-Agent-oriented smali/baksmali fork: dex assembler/disassembler + query layer (JSON/xref/search)'
                        url = 'https://github.com/android-security-engineer/smali-skills'

                        licenses {
                            license {
                                name = 'The BSD 3-Clause License'
                                url = 'http://opensource.org/licenses/BSD-3-Clause'
                                distribution = 'repo'
                            }
                        }
                        scm {
                            connection = 'scm:git:git://github.com/android-security-engineer/smali-skills.git'
                            developerConnection = 'scm:git:git@github.com:android-security-engineer/smali-skills.git'
                            url = 'https://github.com/android-security-engineer/smali-skills'
                        }
                        developers {
                            developer {
                                id = 'jesusfreke'
                                name = 'Ben Gruver'
                                email = 'jesusfreke@jesusfreke.com'
                                roles = ['Original author of smali/baksmali']
                            }
                            developer {
                                id = 'android-security-engineer'
                                name = 'android-security-engineer'
                                url = 'https://github.com/android-security-engineer'
                                roles = ['Maintainer of the smali-skills fork']
                            }
                        }
                    }
                }
            }
            if (rootProject.hasProperty('sonatypeUsername') && rootProject.hasProperty('sonatypePassword')) {
                repositories {
                    maven {
                        // Sonatype Central Portal OSSRH-compatible staging API.
                        // The legacy oss.sonatype.org endpoint was sunset in 2025;
                        // the Central Portal accepts staged deploys at this URL.
                        name = 'centralPortal'
                        url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
                        credentials {
                            username sonatypeUsername
                            password sonatypePassword
                        }
                    }
                }
            }
        }

        signing {
            required { gradle.taskGraph.hasTask('publish') }
            // In CI, supply an ASCII-armored key + passphrase via
            // ORG_GRADLE_PROJECT_signingKey / ORG_GRADLE_PROJECT_signingPassword
            // (Gradle maps these to the `signingKey`/`signingPassword` props).
            def signingKey = project.findProperty('signingKey')
            def signingPassword = project.findProperty('signingPassword')
            if (signingKey) {
                useInMemoryPgpKeys(signingKey, signingPassword)
            }
            sign(publishing.publications["mavenJava"])
        }

        java {
            withJavadocJar()
            withSourcesJar()
        }

        tasks.getByPath(':release').dependsOn(publish)
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // 6.10.x is the last JGit line that still runs on Java 11 (7.x needs 17).
        classpath 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    }
}

wrapper {
    gradleVersion = '6.8.2'
    distributionType = Wrapper.DistributionType.ALL
}

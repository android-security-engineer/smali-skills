name: Maven Central Publish

# Publishes dexlib2 / util / smali / baksmali to the Sonatype Central Portal
# staging area. After a successful run, log in to https://central.sonatype.com
# and "Publish" the staged deployment (or configure auto-release).
#
# Required repository secrets:
#   SONATYPE_USERNAME   — Central Portal user token name
#   SONATYPE_PASSWORD   — Central Portal user token secret
#   GPG_SIGNING_KEY     — ASCII-armored private key (gpg --armor --export-secret-keys)
#   GPG_SIGNING_PASSWORD— passphrase for that key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (informational; build derives it from git)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if the publishing credentials are configured.
    if: ${{ github.repository == 'android-security-engineer/smali-skills' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Sonatype Central Portal
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_sonatypeUsername" ]; then
            echo "SONATYPE_USERNAME not set — skipping publish (configure secrets to enable)."
            exit 0
          fi
          ./gradlew publish -x test -x javadoc --no-daemon
